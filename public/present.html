<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Poll — Present</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/present.css" />
</head>
<body class="present-body">
  <div class="present-wrap">
    <div id="brandLogo" class="brand-logo present-brand-logo hidden"><img id="brandLogoImg" alt="" /></div>

    <div id="timerBlock" class="hidden">
      <div id="timerDisplay" class="present-timer"></div>
      <div class="present-timer-caption">MIN&nbsp;:&nbsp;SEC</div>
    </div>

    <div id="waiting" class="present-waiting">
      <p><span class="dot"></span><span id="waitingText">Waiting for the next question&hellip;</span></p>
      <img id="agendaImage" class="present-agenda hidden" alt="Agenda" />
    </div>

    <div id="pollCard" class="present-card hidden">
      <h1 id="questionText" class="present-question"></h1>
      <div class="present-results" id="resultsList"></div>
      <p class="present-total" id="totalVotes"></p>
    </div>
  </div>

  <div id="voteQrCorner" class="vote-qr-corner hidden">
    <img id="voteQrImg" src="/admin/qr.svg" alt="QR code to vote" />
    <p class="vote-qr-text">Scan to vote,<br>or go to <strong>jtask.com/q</strong></p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/brands.js"></script>
  <script src="/present.js"></script>
</body>
</html>
